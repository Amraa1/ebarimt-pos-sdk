name: Dependency Audit

permissions:
    contents: read

on:
    pull_request:
        branches: [main]
        paths:
            - "pyproject.toml"
            - "uv.lock"
            - ".github/workflows/dependency-audit.yaml"
    push:
        branches: [main]
        paths:
            - "pyproject.toml"
            - "uv.lock"
            - ".github/workflows/dependency-audit.yaml"
    schedule:
        # Weekly, so newly published advisories against the locked set surface
        # even when nothing in the repo changes.
        - cron: "17 4 * * 1"
    workflow_dispatch:

jobs:
    pip-audit:
        name: pip-audit (locked dependency set)
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  persist-credentials: false

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version-file: ".python-version"

            - name: Install uv
              uses: astral-sh/setup-uv@v7
              with:
                  version: "0.11.7"
                  enable-cache: true

            - name: Export locked requirements
              run: >
                  uv export --frozen --all-groups --all-extras --no-hashes
                  --no-emit-project -o requirements-audit.txt

            - name: Audit for known vulnerabilities
              run: uvx pip-audit -r requirements-audit.txt --strict --desc on
