name: Dependency Audit

permissions:
    contents: read

on:
    pull_request:
        branches: [main]
        paths:
            - "pyproject.toml"
            - "uv.lock"
            - ".github/workflows/dependency-audit.yaml"
    push:
        branches: [main]
        paths:
            - "pyproject.toml"
            - "uv.lock"
            - ".github/workflows/dependency-audit.yaml"
    schedule:
        # Weekly, so newly published advisories against the locked set surface
        # even when nothing in the repo changes.
        - cron: "17 4 * * 1"
    workflow_dispatch:

jobs:
    pip-audit:
        name: pip-audit (locked dependency set)
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false

            - name: Set up Python
              uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
              with:
                  python-version-file: ".python-version"

            - name: Install uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
              with:
                  version: "0.11.7"
                  enable-cache: true

            - name: Export locked requirements
              run: >
                  uv export --frozen --all-groups --all-extras --no-hashes
                  --no-emit-project -o requirements-audit.txt

            - name: Audit for known vulnerabilities
              run: uvx pip-audit -r requirements-audit.txt --strict --desc on
