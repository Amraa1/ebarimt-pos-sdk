name: Docs

permissions:
    contents: read

on:
    pull_request:
        branches: [main]
        paths:
            - "docs/**"
            - "src/**"
            - "CHANGELOG.md"
            - "pyproject.toml"
            - "uv.lock"
            - ".readthedocs.yaml"
            - ".github/workflows/docs.yaml"

    push:
        branches: [main]
        paths:
            - "docs/**"
            - "src/**"
            - "CHANGELOG.md"
            - "pyproject.toml"
            - "uv.lock"
            - ".readthedocs.yaml"
            - ".github/workflows/docs.yaml"

jobs:
    build:
        name: sphinx (${{ matrix.language }})
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                language: [en, mn]

        steps:
            - name: Checkout
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false

            - name: Set up Python
              uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
              with:
                  python-version-file: ".python-version"

            - name: Install uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
              with:
                  version: "0.11.7"
                  enable-cache: true

            - name: Sync dependencies (frozen)
              run: uv sync --extra docs --frozen

            # Warnings are errors: a broken cross-reference, a docstring with
            # invalid markup, or a translation whose inline markup no longer
            # matches its source fails the build.
            - name: Build (${{ matrix.language }})
              run: >
                  uv run sphinx-build -b html -W --keep-going
                  -D language=${{ matrix.language }}
                  docs/source docs/build/html-${{ matrix.language }}
